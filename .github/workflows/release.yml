name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand from the Actions tab to rebuild an existing release: its zip is rebuilt
  # from the tag, and its notes are refreshed from CHANGELOG.md on the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$TAG" > notes.md

      - name: Use the addon files from the tag
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "$TAG" -- CombatCues

      - name: Package addon
        id: package
        run: echo "zip=$(scripts/package.sh "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: |
          gh release create "$TAG" "${{ steps.package.outputs.zip }}" \
            --title "CombatCues $TAG" \
            --notes-file notes.md

      - name: Update existing release
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
          gh release edit "$TAG" --notes-file notes.md
